name: CI

on:
  pull_request:
  # Pushes to master and tags run this through release.yml (canary and stable builds),
  # so nothing ships that hasn't passed it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (types, unit, Rust, E2E)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # One target dir for clippy, cargo test and the E2E harness's debug build (which
      # forces this same dir), so the cache holds one set of compiled dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-harness
      CARGO_TERM_COLOR: always
      # Line numbers only, not full debug info: compiling and linking are quicker and the
      # cache is smaller (faster to restore and save). Panic backtraces keep file:line.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target-harness
          # Only master writes the cache; PRs restore it.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests format dates with the default locale (Node and WebView2 both follow the
      # Windows region format) and were written on an en-AU, Sydney machine. Runners are
      # en-US and UTC. Each later step is a new process, so it picks these up.
      - name: Use the en-AU region and Sydney time zone
        shell: pwsh
        run: |
          Set-Culture en-AU
          Set-TimeZone -Id 'AUS Eastern Standard Time'
          node -e "const o = Intl.DateTimeFormat().resolvedOptions(); console.log(o.locale, o.timeZone)"

      - name: Version is consistent
        run: pnpm version:check

      - name: Types (svelte-check)
        run: pnpm check

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      - name: Clippy
        run: pnpm lint:rust

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: E2E (Playwright against the fake servers)
        run: pnpm test:e2e

      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  linux:
    name: Linux (clippy, Rust tests, AppImage smoke test)
    # The release's Linux build runs here too: the oldest supported Ubuntu LTS.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file \
            xvfb dbus-x11

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clippy
        run: pnpm lint:rust

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The E2E suite drives WebView2 over CDP, which WebKitGTK doesn't have, so on Linux
      # the check is that a real AppImage builds and starts.
      - name: Build a debug AppImage
        run: pnpm tauri build --debug --bundles appimage

      - name: Smoke-test the AppImage
        # Offline, as the release build's smoke test runs: this checks that works on the runner.
        run: SMOKE_OFFLINE=1 sh tests/linux/smoke.sh src-tauri/target/debug/bundle/appimage/PeetMail_*_amd64.AppImage

  android:
    name: Android (clippy, tests compile)
    # GitHub's Ubuntu image carries the Android NDK (ANDROID_NDK_LATEST_HOME). The tests
    # need a device to run, so this checks the Android arms compile and pass clippy; the
    # APK build and an emulator smoke test come with docs/ANDROID.md Stage 6.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy and test build for aarch64-linux-android
        run: node scripts/android-lint.ts

  server:
    name: Sync server (types, tests, Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter peetmail-sync

      - name: Types (svelte-check)
        run: pnpm server:check

      - name: Tests (Vitest)
        run: pnpm server:test

      # Built, not pushed: publishing the image is a separate step (docs/SYNC.md, stage 2).
      - name: Docker image
        run: docker build -f server/Dockerfile -t peetmail-sync:ci .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Licences, bans, sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources

      # New advisories appear without any change here; report them without blocking
      # unrelated work. A release (a tag push, which calls this workflow) fails on them.
      - name: Security advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm advisories (production dependencies)
        run: pnpm audit --prod
