[package]
name = "peetmail"
version = "0.2.1"
description = "PeetMail, a fast keyboard-first mail and calendar client"
authors = ["Peet Software"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peetmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.21"
ammonia = "4.2.4"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2.5.8"
getrandom = "0.4.3"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "2"
# Minidumps (a crash-reporter process) are desktop only; see the desktop table below.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
regex = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
# OTLP over HTTP/JSON (what the gateway takes, and what the harness's fake collector reads).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-json", "reqwest-blocking-client", "trace", "metrics", "logs"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Settings sync (src/sync/): AES-256-GCM, HKDF and HMAC for items, and the passphrase's
# key derivation. ring is already in the tree through rustls.
ring = "0.17"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# Desktop only: the tray, autostart, single-instance and the self-updater have no Android
# counterpart (Android updates go through the APK installer, docs/ANDROID.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# No `zip` feature: our update artifacts are the NSIS setup exe and the AppImage themselves
# (createUpdaterArtifacts v2), so the zip/tar extraction code (and its advisories) isn't needed.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
sentry = { version = "0.49", default-features = false, features = ["minidump"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Saved sign-ins: a key in the desktop keyring (Secret Service) encrypts them (secure.rs).
# zbus 5 is already in the tree (notifications, single-instance); ring is a dependency above.
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
# Line tables give crash reports file:line frames. With MSVC the debug info goes into a
# separate peetmail.pdb (attached to each release, not installed); `strip` still leaves it
# and the exe's link to it intact, and only trims the exe.
debug = "line-tables-only"

# Dependencies (html5ever/ammonia, serde_json, rusqlite...) are compiled optimised even in
# dev builds: sanitising a 1 MB email took ~0.5s unoptimised. Our own crate stays at
# opt-level 0 so incremental builds remain fast.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
semver = "1"
# Paused-clock tests (auth.rs retries).
tokio = { version = "1.54.1", features = ["test-util"] }
